<VirtualHost *:80>
    DocumentRoot /app/public
    ServerSignature Off

    <Directory /app/public>
        AllowOverride None
        Require all granted
        # Route every request that isn't a real file to the front controller.
        FallbackResource /index.php
    </Directory>

    # Make the Authorization header visible to PHP (Bearer token auth).
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
